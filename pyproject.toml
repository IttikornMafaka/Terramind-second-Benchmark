
[project]
name = "TerraMind"
version = "0.1.0"
description = "A Hybrid CNN-Transformer Framework for Multi-Task Semantic Change Detection in Remote Sensing Imagery"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "jupyter>=1.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "albumentations>=2.0",
    "scikit-learn>=1.5",
    "torchmetrics>=1.5",
    "tensorboard>=2.18",
    "torch==2.15.0+cu132",
    "torchvision==0.29.2+cu132",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ipykernel>=6.29",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
